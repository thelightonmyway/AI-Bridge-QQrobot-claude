# Read the Docs 配置
# 文档参考: https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# RTD 用 git tag 自动建版本（latest / stable / v0.1.0 / v0.1.1 ...），
# 见 docs/source/release.rst 与项目 README 的手工配置步骤。

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"

python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/source/conf.py
  # 失败时也构建（便于在 RTD 界面看到部分结果）；发布阶段建议改回 true
  fail_on_warning: false
